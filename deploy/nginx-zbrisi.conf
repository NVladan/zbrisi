# nginx site config for zbriši on a Contabo VPS.
# Install:  sudo cp deploy/nginx-zbrisi.conf /etc/nginx/sites-available/zbrisi
#           sudo ln -s /etc/nginx/sites-available/zbrisi /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see DEPLOY.md) — it rewrites this to add the HTTPS (443)
# block and an HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name zbrisi.com www.zbrisi.com;

    # Serve static files straight from disk (faster than going through Flask).
    location /static/ {
        alias /home/vladan/zbrisi/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;

        # These headers are what ProxyFix(x_for/x_proto/x_host) reads so that
        # canonical, hreflang and sitemap URLs come out as https://zbrisi.com/...
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
    }
}
